[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wifit"
version = "3.0.0-rc.1"
description = "Professional WPS Testing Toolkit for Android/Termux"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "TuHiN", email = "tuhin@wifit.local"},
]
maintainers = [
    {name = "TuHiN", email = "tuhin@wifit.local"},
]
keywords = [
    "wps",
    "wifi",
    "security",
    "penetration-testing",
    "termux",
    "android",
    "pixie-dust",
    "bruteforce",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Android",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: System :: Networking",
    "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
test = [
    "pytest>=7.4.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.5.0",
    "ruff>=0.1.0",
    "bandit[toml]>=1.7.5",
]
display = [
    "pyfiglet>=0.8.0",
]
system = [
    "psutil>=5.9.0",
]

[project.urls]
Homepage = "https://github.com/TuHiN22/WiFiT"
Documentation = "https://github.com/TuHiN22/WiFiT/blob/master/README.md"
Repository = "https://github.com/TuHiN22/WiFiT"
Issues = "https://github.com/TuHiN22/WiFiT/issues"
Changelog = "https://github.com/TuHiN22/WiFiT/blob/master/CHANGELOG.md"

[project.scripts]
wifit = "wifit:main"

[tool.setuptools]
packages = ["wifit_core", "wifit_core.data"]
py-modules = ["wifit"]
include-package-data = true

[tool.setuptools.package-data]
wifit_core = ["data/*.txt"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--showlocals",
]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*", "*Tests"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["wifit_core", "wifit"]
omit = [
    "tests/*",
    "*/test_*.py",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true

[[tool.mypy.overrides]]
module = "pyfiglet.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "psutil.*"
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py310"
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "ARG",  # flake8-unused-arguments
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # function calls in argument defaults
    "B904",   # raise from within except without explicit exception
]

[tool.ruff.per-file-ignores]
"tests/**/*.py" = [
    "ARG",    # unused arguments are common in test fixtures
    "S101",   # assert is expected in tests
]

[tool.bandit]
exclude_dirs = ["tests", ".venv", "venv"]
skips = ["B404", "B603"]  # Allow subprocess without shell=True check (we validate elsewhere)

[tool.bandit.assert_used]
skips = ["**/test_*.py"]
